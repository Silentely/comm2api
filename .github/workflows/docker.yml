name: Docker Image

on:
  pull_request:
    paths:
      - "proxy.mjs"
      - "lib/**"
      - "test/**"
      - "web/**"
      - "package.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  push:
    branches: ["main", "dev"]
    tags: ["v*"]
    paths:
      - "proxy.mjs"
      - "lib/**"
      - "test/**"
      - "web/**"
      - "package.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      - "!docs/**"
      - "!**/*.md"
      - "!.claude/**"
      - "!.codex/**"
      - "!.omc/**"
      - "!.omx/**"
      - "!.skills/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write # cleanup-old-runs 删除本工作流历史运行记录

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Run Node test suite
        run: pnpm test

  frontend-build:
    name: Frontend build check
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: web
        run: pnpm run build

  # 镜像构建并推送至 GHCR（ghcr.io/<owner>/<repo>）：
  # - v* 标签：vX.Y.Z + latest（正式发版，双架构 linux/amd64 + linux/arm64）
  # - main 分支：main + main-<sha> + latest（主干发布，双架构 linux/amd64 + linux/arm64）
  # - dev 分支：dev + dev-<sha>（预发滚动，linux/amd64）
  # - workflow_dispatch（其它分支）：test-<branch> + test-<sha>（linux/amd64）
  build-and-push:
    name: Build and push GHCR image
    needs: [test, frontend-build]
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        # 正式 tag 与 main 分支构建双架构（amd64 + arm64）
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image tags and metadata
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${repo}"
          short_sha="${GITHUB_SHA::12}"

          # 平台：正式 tag 与 main 分支双架构；dev / 其它手动分支仅 amd64
          if [[ "${GITHUB_REF}" == refs/tags/v* || "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "platforms=linux/amd64,linux/arm64" >> "${GITHUB_OUTPUT}"
          else
            echo "platforms=linux/amd64" >> "${GITHUB_OUTPUT}"
          fi

          # 镜像标签策略
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            {
              echo "tags<<EOF"
              echo "${image}:${GITHUB_REF_NAME}"
              echo "${image}:latest"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            {
              echo "tags<<EOF"
              echo "${image}:main"
              echo "${image}:main-${short_sha}"
              echo "${image}:latest"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          elif [[ "${GITHUB_REF_NAME}" == "dev" ]]; then
            {
              echo "tags<<EOF"
              echo "${image}:dev"
              echo "${image}:dev-${short_sha}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          else
            safe_ref="$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')"
            {
              echo "tags<<EOF"
              echo "${image}:test-${safe_ref}"
              echo "${image}:test-${short_sha}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          fi

          # 版本号：tag 用 ref 名；否则从 package.json 读取 version
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            app_version="${GITHUB_REF_NAME}"
          else
            app_version="$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -1)"
            if [[ -z "${app_version}" ]]; then
              app_version="0.0.0"
            fi
          fi
          echo "app_version=${app_version}" >> "${GITHUB_OUTPUT}"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ steps.vars.outputs.platforms }}
          tags: ${{ steps.vars.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=comm2api
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.app_version }}
            org.opencontainers.image.created=${{ steps.vars.outputs.build_time }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            APP_VERSION=${{ steps.vars.outputs.app_version }}
            BUILD_TIME=${{ steps.vars.outputs.build_time }}

  # 每次本工作流运行结束后清理历史：至少保留最近 3 次已完成记录，并删除 3 天前的其余记录。
  # 无 schedule；不依赖构建是否成功/跳过。
  cleanup-old-runs:
    name: Cleanup old workflow runs
    needs: [test, frontend-build, build-and-push]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete old Docker Image runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_FILE: docker.yml
          KEEP_MINIMUM: "3"
          RETAIN_DAYS: "3"
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Listing completed runs for workflow ${WORKFLOW_FILE} (keep>=${KEEP_MINIMUM}, retain_days=${RETAIN_DAYS})"

          # 按时间倒序，最多取 100 条已完成运行
          runs_json="$(
            gh run list \
              --repo "${GH_REPO}" \
              --workflow "${WORKFLOW_FILE}" \
              --status completed \
              --limit 100 \
              --json databaseId,createdAt,displayTitle,conclusion
          )"

          count="$(echo "${runs_json}" | jq 'length')"
          echo "Found ${count} completed run(s)"
          if [[ "${count}" -eq 0 ]]; then
            echo "Nothing to clean"
            exit 0
          fi

          now_epoch="$(date -u +%s)"
          cutoff_epoch="$((now_epoch - RETAIN_DAYS * 86400))"
          deleted=0
          kept=0
          skipped_young=0

          # 索引 0 为最新：前 KEEP_MINIMUM 条始终保留；其余仅当 createdAt 早于 cutoff 时删除
          while IFS=$'\t' read -r run_id created_at; do
            [[ -n "${run_id}" ]] || continue
            # 绝不删除当前这次运行（正常为 in_progress，一般不在 completed 列表里）
            if [[ "${run_id}" == "${CURRENT_RUN_ID}" ]]; then
              echo "Skip current run ${run_id}"
              continue
            fi

            kept=$((kept + 1))
            if [[ "${kept}" -le "${KEEP_MINIMUM}" ]]; then
              echo "Keep recent #${kept}: ${run_id} (${created_at})"
              continue
            fi

            created_epoch="$(date -u -d "${created_at}" +%s 2>/dev/null || date -u -j -f "%Y-%m-%dT%H:%M:%SZ" "${created_at}" +%s 2>/dev/null || echo 0)"
            if [[ "${created_epoch}" -eq 0 ]]; then
              echo "Skip unparsable date for run ${run_id}: ${created_at}"
              continue
            fi

            if [[ "${created_epoch}" -ge "${cutoff_epoch}" ]]; then
              echo "Keep (within ${RETAIN_DAYS}d): ${run_id} (${created_at})"
              skipped_young=$((skipped_young + 1))
              continue
            fi

            echo "Delete old run ${run_id} (${created_at})"
            if gh api --method DELETE "repos/${GH_REPO}/actions/runs/${run_id}" >/dev/null; then
              deleted=$((deleted + 1))
            else
              echo "Warning: failed to delete run ${run_id}" >&2
            fi
          done < <(echo "${runs_json}" | jq -r '.[] | "\(.databaseId)\t\(.createdAt)"')

          echo "Cleanup done: deleted=${deleted}, recent_kept_slots=${KEEP_MINIMUM}, young_extra_kept=${skipped_young}"
